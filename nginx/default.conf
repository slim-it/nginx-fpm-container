map $http_x_forwarded_proto $external_scheme {
    http    http;
    https   https;
    default $scheme;
}

map $http_x_forwarded_proto $external_server_port {
    http    80;
    https   443;
    default $server_port;
}

map $external_scheme $external_https {
    default "";
    https   on;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # TLS terminates at the ingress. Keep nginx-generated redirects relative so
    # its internal HTTP scheme and unprivileged port never reach clients.
    absolute_redirect off;

    server_tokens off;
    index index.php;

    location ~ /\. {
        return 404;
    }

    include /etc/nginx/app.d/*.conf;
}
