server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # TLS terminates at the ingress. Keep nginx-generated redirects relative so
    # its internal HTTP scheme and unprivileged port never reach clients.
    absolute_redirect off;

    server_tokens off;
    index index.php;

    location ~ /\. {
        return 404;
    }

    include /etc/nginx/app.d/*.conf;
}
